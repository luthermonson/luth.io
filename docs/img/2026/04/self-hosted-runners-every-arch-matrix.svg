<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Three boxes, five runner targets</text>

  <!-- GitHub -->
  <rect x="330" y="58" width="240" height="52" rx="8" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/>
  <text x="450" y="81" text-anchor="middle" font-size="16" font-weight="600" fill="#222">github.com</text>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#6b6b6b">jobs queued by runs-on labels</text>

  <!-- arrows (outbound only) -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M150 200 L 360 114"/>
    <path d="M450 200 L 450 116"/>
    <path d="M750 200 L 540 114"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
  <rect x="300" y="147" width="300" height="20" fill="#ffffff"/>
  <text x="450" y="161" text-anchor="middle" font-size="12" fill="#6b6b6b">outbound HTTPS long-poll only, no inbound ports</text>

  <!-- Mac mini -->
  <rect x="40" y="200" width="220" height="230" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#2b6cb0">M1 Mac mini</text>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#6b6b6b">macOS, bare metal</text>
  <rect x="60" y="270" width="180" height="56" rx="6" fill="#2b6cb0"/>
  <text x="150" y="294" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">macOS / ARM64</text>
  <text x="150" y="313" text-anchor="middle" font-size="11" fill="#fff">launchd agent</text>

  <!-- Dev Kit -->
  <rect x="340" y="200" width="220" height="230" rx="10" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#e07a1f">Windows Dev Kit 2023</text>
  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#6b6b6b">Windows 11 Pro, Snapdragon</text>
  <rect x="360" y="270" width="180" height="56" rx="6" fill="#e07a1f"/>
  <text x="450" y="294" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Windows / ARM64</text>
  <text x="450" y="313" text-anchor="middle" font-size="11" fill="#fff">Windows service</text>
  <rect x="360" y="340" width="180" height="70" rx="6" fill="#ffffff" stroke="#e07a1f" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#6b6b6b">Hyper-V VM</text>
  <text x="450" y="384" text-anchor="middle" font-size="14" fill="#e07a1f" font-weight="600">Linux / ARM64</text>
  <text x="450" y="401" text-anchor="middle" font-size="11" fill="#6b6b6b">systemd unit</text>

  <!-- Proxmox -->
  <rect x="640" y="200" width="220" height="230" rx="10" fill="#ffffff" stroke="#3a9a5b" stroke-width="2"/>
  <text x="750" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#3a9a5b">Proxmox VE host</text>
  <text x="750" y="248" text-anchor="middle" font-size="12" fill="#6b6b6b">x86_64, already in the lab</text>
  <rect x="660" y="270" width="180" height="56" rx="6" fill="#3a9a5b"/>
  <text x="750" y="294" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Linux / X64</text>
  <text x="750" y="313" text-anchor="middle" font-size="11" fill="#fff">VM, systemd unit</text>
  <rect x="660" y="340" width="180" height="70" rx="6" fill="#3a9a5b"/>
  <text x="750" y="368" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Windows / X64</text>
  <text x="750" y="388" text-anchor="middle" font-size="11" fill="#fff">VM, Windows service</text>
</svg>

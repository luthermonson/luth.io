<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#222">PHP opens a connection per request. MySQL shouldn't have to.</text>
  <text x="600" y="72" text-anchor="middle" font-size="16" fill="#6b6b6b">ePHPm's proxy fakes the handshake locally and lends PHP an already-authenticated backend for the session</text>

  <g font-size="15">
    <rect x="40" y="120" width="230" height="300" rx="12" fill="#7d5ba6" opacity="0.10" stroke="#7d5ba6" stroke-width="2"/>
    <text x="155" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#7d5ba6">PHP request</text>
    <text x="155" y="190" text-anchor="middle" fill="#333">new PDO(...)</text>
    <text x="155" y="215" text-anchor="middle" fill="#6b6b6b" font-size="13">handshake answered by proxy</text>
    <text x="155" y="255" text-anchor="middle" fill="#333">SET NAMES / queries</text>
    <text x="155" y="295" text-anchor="middle" fill="#333">$pdo = null</text>
    <text x="155" y="320" text-anchor="middle" fill="#6b6b6b" font-size="13">COM_QUIT: swallowed,</text>
    <text x="155" y="338" text-anchor="middle" fill="#6b6b6b" font-size="13">never forwarded</text>

    <rect x="370" y="120" width="420" height="300" rx="12" fill="#3a9a5b" opacity="0.10" stroke="#3a9a5b" stroke-width="2"/>
    <text x="580" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#3a9a5b">ePHPm MySQL proxy (127.0.0.1:3306)</text>
    <rect x="395" y="170" width="370" height="60" rx="8" fill="#fff" stroke="#3a9a5b"/>
    <text x="580" y="196" text-anchor="middle" fill="#222">checkout: pop an idle backend</text>
    <text x="580" y="218" text-anchor="middle" fill="#6b6b6b" font-size="13">COM_PING first if it sat idle ≥ 500 ms</text>
    <rect x="395" y="245" width="370" height="60" rx="8" fill="#fff" stroke="#3a9a5b"/>
    <text x="580" y="271" text-anchor="middle" fill="#222">relay packets, sniff each command</text>
    <text x="580" y="293" text-anchor="middle" fill="#6b6b6b" font-size="13">anything but SELECT / SHOW / PING sets dirty</text>
    <rect x="395" y="320" width="175" height="80" rx="8" fill="#fff" stroke="#e07a1f"/>
    <text x="482" y="350" text-anchor="middle" fill="#b35f12" font-weight="600">dirty</text>
    <text x="482" y="374" text-anchor="middle" fill="#222" font-size="13">COM_RESET_CONNECTION</text>
    <text x="482" y="392" text-anchor="middle" fill="#222" font-size="13">then park</text>
    <rect x="590" y="320" width="175" height="80" rx="8" fill="#fff" stroke="#2b6cb0"/>
    <text x="677" y="350" text-anchor="middle" fill="#2b6cb0" font-weight="600">clean</text>
    <text x="677" y="374" text-anchor="middle" fill="#222" font-size="13">park as-is</text>
    <text x="677" y="392" text-anchor="middle" fill="#222" font-size="13">(no round trip)</text>

    <rect x="890" y="120" width="270" height="300" rx="12" fill="#2b6cb0" opacity="0.10" stroke="#2b6cb0" stroke-width="2"/>
    <text x="1025" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#2b6cb0">MySQL</text>
    <g fill="#2b6cb0" opacity="0.8">
      <rect x="935" y="185" width="180" height="34" rx="6"/>
      <rect x="935" y="229" width="180" height="34" rx="6"/>
      <rect x="935" y="273" width="180" height="34" rx="6"/>
      <rect x="935" y="317" width="180" height="34" rx="6"/>
    </g>
    <g fill="#fff" font-size="14" text-anchor="middle">
      <text x="1025" y="207">backend conn 1</text>
      <text x="1025" y="251">backend conn 2</text>
      <text x="1025" y="295">backend conn 3</text>
      <text x="1025" y="339">backend conn 4</text>
    </g>
    <text x="1025" y="385" text-anchor="middle" fill="#333" font-size="13">authenticated once,</text>
    <text x="1025" y="403" text-anchor="middle" fill="#333" font-size="13">reused across requests</text>
  </g>

  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="270" y1="200" x2="366" y2="200"/>
    <line x1="270" y1="275" x2="366" y2="275"/>
    <line x1="790" y1="275" x2="886" y2="275"/>
  </g>

  <text x="600" y="480" text-anchor="middle" font-size="16" fill="#333">reset_strategy = "smart" (default) | "always" | "never"</text>
  <text x="600" y="508" text-anchor="middle" font-size="14" fill="#6b6b6b">"smart" only skips the reset when a session never changed state. WordPress changes state on every connect.</text>
</svg>

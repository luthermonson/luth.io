<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Two ways PHP can arm max_execution_time</text>

  <!-- left column -->
  <text x="200" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#c0392b">Without per-thread timers</text>
  <rect x="50" y="86" width="300" height="50" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="200" y="116" text-anchor="middle" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#222">setitimer(ITIMER_PROF)</text>
  <rect x="50" y="164" width="300" height="50" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="200" y="186" text-anchor="middle" font-size="13" fill="#222">SIGPROF goes to the process:</text>
  <text x="200" y="204" text-anchor="middle" font-size="13" fill="#222">the kernel picks any thread</text>
  <rect x="50" y="242" width="300" height="50" rx="8" fill="#fbeceb" stroke="#c0392b" stroke-width="1.5"/>
  <text x="200" y="264" text-anchor="middle" font-size="13" fill="#222">lands on a tokio thread with</text>
  <text x="200" y="282" text-anchor="middle" font-size="13" fill="#222">no PHP globals: SIGSEGV</text>
  <rect x="50" y="320" width="300" height="56" rx="8" fill="#fdf1e6" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="200" y="344" text-anchor="middle" font-size="13" fill="#222">so ePHPm --wrap'd zend_set_timeout</text>
  <text x="200" y="362" text-anchor="middle" font-size="13" fill="#222">to a no-op: no timeout at all</text>
  <path d="M200 136 L200 160" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M200 214 L200 238" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M200 292 L200 316" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>

  <!-- right column -->
  <text x="600" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#2d7a47">ZEND_MAX_EXECUTION_TIMERS (in our SDK)</text>
  <rect x="450" y="86" width="300" height="50" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="600" y="108" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#222">timer_create(CLOCK_BOOTTIME,</text>
  <text x="600" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace" fill="#222">SIGEV_THREAD_ID, SIGRTMIN)</text>
  <rect x="450" y="164" width="300" height="50" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="600" y="186" text-anchor="middle" font-size="13" fill="#222">SIGRTMIN goes only to the</text>
  <text x="600" y="204" text-anchor="middle" font-size="13" fill="#222">PHP thread that armed it</text>
  <rect x="450" y="242" width="300" height="50" rx="8" fill="#edf7f0" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="600" y="264" text-anchor="middle" font-size="13" fill="#222">"Maximum execution time of 2</text>
  <text x="600" y="282" text-anchor="middle" font-size="13" fill="#222">seconds exceeded": a real 500</text>
  <rect x="450" y="320" width="300" height="56" rx="8" fill="#edf7f0" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="600" y="344" text-anchor="middle" font-size="13" fill="#222">busy loop: 500 at 2.004 s</text>
  <text x="600" y="362" text-anchor="middle" font-size="13" fill="#222">blocking FIFO fread: 500 at 2.004 s</text>
  <path d="M600 136 L600 160" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M600 214 L600 238" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M600 292 L600 316" stroke="#6b6b6b" stroke-width="2" marker-end="url(#k)"/>

  <line x1="400" y1="60" x2="400" y2="390" stroke="#dddddd" stroke-width="1.5"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#222">The API your app already calls, routed to the native functions</text>
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b6b">your code calls</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b6b">ePHPm package</text>
  <text x="760" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b6b">native functions</text>

  <g font-size="13" fill="#222">
    <!-- KV rows -->
    <g>
      <rect x="40" y="74" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="93" text-anchor="middle">new \Redis()</text>
      <rect x="340" y="74" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="93" text-anchor="middle">phpredis-shim</text>
      <rect x="40" y="106" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="125" text-anchor="middle">Predis\Client</text>
      <rect x="340" y="106" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="125" text-anchor="middle">predis-connection</text>
      <rect x="40" y="138" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="157" text-anchor="middle">wp_cache_get() / add()</text>
      <rect x="340" y="138" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="157" text-anchor="middle">cache-wordpress</text>
      <rect x="40" y="170" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="189" text-anchor="middle">PSR-6 / PSR-16</text>
      <rect x="340" y="170" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="189" text-anchor="middle">cache</text>
      <rect x="40" y="202" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="221" text-anchor="middle">Cache:: / Symfony Cache</text>
      <rect x="340" y="202" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="221" text-anchor="middle">cache-laravel, cache-symfony</text>
      <rect x="40" y="234" width="200" height="28" rx="5" fill="#eaf2fb" stroke="#2b6cb0"/><text x="140" y="253" text-anchor="middle">$_SESSION</text>
      <rect x="340" y="234" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="253" text-anchor="middle">session-handler</text>
    </g>
    <!-- DB rows -->
    <g>
      <rect x="40" y="290" width="200" height="28" rx="5" fill="#e9f6ee" stroke="#3a9a5b"/><text x="140" y="309" text-anchor="middle">$wpdb</text>
      <rect x="340" y="290" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="309" text-anchor="middle">db-wordpress</text>
      <rect x="40" y="322" width="200" height="28" rx="5" fill="#e9f6ee" stroke="#3a9a5b"/><text x="140" y="341" text-anchor="middle">mysqli</text>
      <rect x="340" y="322" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="341" text-anchor="middle">mysqli-shim</text>
      <rect x="40" y="354" width="200" height="28" rx="5" fill="#e9f6ee" stroke="#3a9a5b"/><text x="140" y="373" text-anchor="middle">DB:: / Eloquent</text>
      <rect x="340" y="354" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="373" text-anchor="middle">db-laravel</text>
      <rect x="40" y="386" width="200" height="28" rx="5" fill="#e9f6ee" stroke="#3a9a5b"/><text x="140" y="405" text-anchor="middle">Doctrine DBAL</text>
      <rect x="340" y="386" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="405" text-anchor="middle">db-doctrine</text>
      <rect x="40" y="418" width="200" height="28" rx="5" fill="#e9f6ee" stroke="#3a9a5b"/><text x="140" y="437" text-anchor="middle">CodeIgniter 4 DB</text>
      <rect x="340" y="418" width="200" height="28" rx="5" fill="#f4f4f4" stroke="#6b6b6b"/><text x="440" y="437" text-anchor="middle">db-codeigniter</text>
    </g>
  </g>

  <!-- targets -->
  <rect x="660" y="128" width="200" height="80" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="760" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#2b6cb0">ephpm_kv_*</text>
  <text x="760" y="184" text-anchor="middle" font-size="11" fill="#6b6b6b">in-process KV store</text>
  <rect x="660" y="326" width="200" height="80" rx="8" fill="#e9f6ee" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="760" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#3a9a5b">ephpm_db_*</text>
  <text x="760" y="382" text-anchor="middle" font-size="11" fill="#6b6b6b">litewire session, SQLite</text>
  <text x="760" y="436" text-anchor="middle" font-size="11" fill="#6b6b6b">(+ db: base wrapper)</text>

  <g stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#a)" fill="none">
    <line x1="240" y1="88" x2="338" y2="88"/><line x1="240" y1="120" x2="338" y2="120"/>
    <line x1="240" y1="152" x2="338" y2="152"/><line x1="240" y1="184" x2="338" y2="184"/>
    <line x1="240" y1="216" x2="338" y2="216"/><line x1="240" y1="248" x2="338" y2="248"/>
    <line x1="240" y1="304" x2="338" y2="304"/><line x1="240" y1="336" x2="338" y2="336"/>
    <line x1="240" y1="368" x2="338" y2="368"/><line x1="240" y1="400" x2="338" y2="400"/>
    <line x1="240" y1="432" x2="338" y2="432"/>
    <line x1="540" y1="88" x2="658" y2="160"/><line x1="540" y1="120" x2="658" y2="164"/>
    <line x1="540" y1="152" x2="658" y2="168"/><line x1="540" y1="184" x2="658" y2="172"/>
    <line x1="540" y1="216" x2="658" y2="176"/><line x1="540" y1="248" x2="658" y2="180"/>
    <line x1="540" y1="304" x2="658" y2="358"/><line x1="540" y1="336" x2="658" y2="362"/>
    <line x1="540" y1="368" x2="658" y2="366"/><line x1="540" y1="400" x2="658" y2="370"/>
    <line x1="540" y1="432" x2="658" y2="374"/>
  </g>
</svg>

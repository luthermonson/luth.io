<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#222">Cluster channel handshake v2 (TCP 7948)</text>

  <rect x="80" y="50" width="200" height="44" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="2"/>
  <text x="180" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#2b6cb0">initiator</text>
  <text x="180" y="87" text-anchor="middle" font-size="12" fill="#6b6b6b">replica dialing the primary</text>
  <rect x="580" y="50" width="200" height="44" rx="6" fill="#fdf3e9" stroke="#e07a1f" stroke-width="2"/>
  <text x="680" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#e07a1f">responder</text>
  <text x="680" y="87" text-anchor="middle" font-size="12" fill="#6b6b6b">primary's listener</text>

  <line x1="180" y1="94" x2="180" y2="530" stroke="#6b6b6b" stroke-dasharray="5 4"/>
  <line x1="680" y1="94" x2="680" y2="530" stroke="#6b6b6b" stroke-dasharray="5 4"/>

  <!-- step 0 -->
  <line x1="180" y1="125" x2="678" y2="125" stroke="#333" marker-end="url(#a)"/>
  <text x="430" y="117" text-anchor="middle" font-size="13" fill="#222">TCP connect</text>
  <rect x="690" y="130" width="160" height="44" rx="4" fill="#fff" stroke="#3a9a5b"/>
  <text x="770" y="148" text-anchor="middle" font-size="11" fill="#3a9a5b">source IP must be a</text>
  <text x="770" y="164" text-anchor="middle" font-size="11" fill="#3a9a5b">live gossip member</text>

  <!-- msg 1 -->
  <line x1="180" y1="205" x2="678" y2="205" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="197" text-anchor="middle" font-size="13" fill="#222">1. [0x02][len][ seal(C_i) ]</text>
  <text x="20" y="200" font-size="11" fill="#6b6b6b">fresh 32-byte C_i</text>

  <!-- msg 2 -->
  <line x1="680" y1="265" x2="182" y2="265" stroke="#e07a1f" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="257" text-anchor="middle" font-size="13" fill="#222">2. [0x02][len][ seal(C_i || C_r) ]</text>
  <text x="430" y="283" text-anchor="middle" font-size="11" fill="#6b6b6b">proves the responder could open C_i; carries its own fresh C_r</text>
  <rect x="10" y="295" width="160" height="44" rx="4" fill="#fff" stroke="#2b6cb0"/>
  <text x="90" y="313" text-anchor="middle" font-size="11" fill="#2b6cb0">constant-time check</text>
  <text x="90" y="329" text-anchor="middle" font-size="11" fill="#2b6cb0">echoed C_i == C_i</text>

  <!-- msg 3 -->
  <line x1="180" y1="365" x2="678" y2="365" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="357" text-anchor="middle" font-size="13" fill="#222">3. [len][ seal(C_r) ]</text>
  <text x="430" y="383" text-anchor="middle" font-size="11" fill="#6b6b6b">a replayer never saw C_r in the clear, so it cannot produce this</text>
  <rect x="690" y="372" width="160" height="44" rx="4" fill="#fff" stroke="#e07a1f"/>
  <text x="770" y="390" text-anchor="middle" font-size="11" fill="#e07a1f">constant-time check</text>
  <text x="770" y="406" text-anchor="middle" font-size="11" fill="#e07a1f">echoed C_r == C_r</text>

  <!-- session -->
  <rect x="150" y="430" width="560" height="44" rx="6" fill="#f3eef9" stroke="#7d5ba6"/>
  <text x="430" y="449" text-anchor="middle" font-size="13" fill="#222">both sides: session key = HKDF(secret, transcript C_i || C_r)</text>
  <text x="430" y="466" text-anchor="middle" font-size="11" fill="#6b6b6b">every later byte is a length-prefixed ChaCha20-Poly1305 frame, unique to this connection</text>

  <line x1="180" y1="505" x2="678" y2="505" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="430" y="497" text-anchor="middle" font-size="13" fill="#c0392b">yamux streams: cdc/&lt;site&gt;, snapshot/&lt;site&gt;, sql/&lt;site&gt;</text>

  <text x="430" y="548" text-anchor="middle" font-size="11" fill="#6b6b6b">Handshake messages use a key from a separate HKDF domain (ephpm-cluster-channel-v1) than gossip or the KV data plane.</text>
</svg>

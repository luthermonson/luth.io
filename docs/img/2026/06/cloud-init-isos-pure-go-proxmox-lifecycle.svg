<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">vm.CloudInit(ctx, "ide2", userdata, metadata, vendordata, networkconfig)</text>

  <g font-size="13">
    <rect x="30" y="70" width="190" height="110" rx="8" fill="#eaf1f8" stroke="#2b6cb0" stroke-width="2"/>
    <text x="125" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#2b6cb0">1. makeCloudInitISO</text>
    <text x="125" y="120" text-anchor="middle" fill="#333">go-diskfs iso9660 in</text>
    <text x="125" y="138" text-anchor="middle" fill="#333">os.TempDir(), label cidata</text>
    <text x="125" y="156" text-anchor="middle" fill="#333">Rock Ridge + Joliet</text>

    <rect x="250" y="70" width="190" height="110" rx="8" fill="#fff4e8" stroke="#e07a1f" stroke-width="2"/>
    <text x="345" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#e07a1f">2. storage.Upload</text>
    <text x="345" y="120" text-anchor="middle" fill="#333">iso content type</text>
    <text x="345" y="138" text-anchor="middle" fill="#333">user-data-&lt;vmid&gt;.iso</text>
    <text x="345" y="156" text-anchor="middle" fill="#333">task.WaitFor</text>

    <rect x="470" y="70" width="190" height="110" rx="8" fill="#f3eef8" stroke="#7d5ba6" stroke-width="2"/>
    <text x="565" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#7d5ba6">3. vm.Config</text>
    <text x="565" y="120" text-anchor="middle" fill="#333">ide2=&lt;storage&gt;:iso/...,</text>
    <text x="565" y="138" text-anchor="middle" fill="#333">media=cdrom; boot order;</text>
    <text x="565" y="156" text-anchor="middle" fill="#333">tag "cloud-init"</text>

    <rect x="690" y="70" width="180" height="110" rx="8" fill="#eaf6ee" stroke="#3a9a5b" stroke-width="2"/>
    <text x="780" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#3a9a5b">4. VM boots</text>
    <text x="780" y="120" text-anchor="middle" fill="#333">nocloud finds a volume</text>
    <text x="780" y="138" text-anchor="middle" fill="#333">labeled cidata, reads</text>
    <text x="780" y="156" text-anchor="middle" fill="#333">meta-data / user-data</text>
  </g>
  <g stroke="#6b6b6b" stroke-width="2" fill="#6b6b6b">
    <line x1="220" y1="125" x2="244" y2="125"/><polygon points="244,119 250,125 244,131"/>
    <line x1="440" y1="125" x2="464" y2="125"/><polygon points="464,119 470,125 464,131"/>
    <line x1="660" y1="125" x2="684" y2="125"/><polygon points="684,119 690,125 684,131"/>
  </g>

  <rect x="250" y="250" width="410" height="90" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#c0392b">5. Cleanup</text>
  <text x="455" y="300" text-anchor="middle" font-size="13" fill="#333">UnmountCloudInitISO(ctx, "ide2"): set none,media=cdrom, delete ISO</text>
  <text x="455" y="320" text-anchor="middle" font-size="13" fill="#333">vm.Delete(): if tagged cloud-init, find and delete the ISO first</text>
  <path d="M780 180 C780 240, 700 290, 666 295" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="390" text-anchor="middle" font-size="13" fill="#6b6b6b">No genisoimage, mkisofs or xorriso on the machine running the Go code.</text>
</svg>

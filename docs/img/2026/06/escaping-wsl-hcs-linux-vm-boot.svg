<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Booting a Linux VM from a Windows service through HCS</text>

  <!-- Windows host box -->
  <rect x="20" y="50" width="400" height="400" rx="8" fill="#f4f7fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="36" y="74" font-weight="600" fill="#2b6cb0">Windows host (ephemerd.exe as LocalSystem)</text>

  <rect x="40" y="90" width="360" height="62" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="56" y="114" font-weight="600" fill="#222">1. extract embedded assets</text>
  <text x="56" y="136" fill="#444" font-size="13">vmlinux (ungzipped from bzImage), base initrd</text>

  <rect x="40" y="164" width="360" height="62" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="56" y="188" font-weight="600" fill="#222">2. build boot initrd</text>
  <text x="56" y="210" fill="#444" font-size="13">base initrd + gzip cpio tail (ephemerd-linux, config)</text>

  <rect x="40" y="238" width="360" height="62" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="56" y="262" font-weight="600" fill="#222">3. HcsCreateComputeSystem / HcsStart</text>
  <text x="56" y="284" fill="#444" font-size="13">vmcompute.dll, schema 2.1, LinuxKernelDirect</text>

  <rect x="40" y="312" width="360" height="62" rx="6" fill="#fff" stroke="#e07a1f"/>
  <text x="56" y="336" font-weight="600" fill="#222">4. read \\.\pipe\ephemerd-vm-* (COM1)</text>
  <text x="56" y="358" fill="#444" font-size="13">scan console for EPHEMERD_IP=</text>

  <rect x="40" y="386" width="360" height="50" rx="6" fill="#fff" stroke="#3a9a5b"/>
  <text x="56" y="416" font-weight="600" fill="#222">5. dial containerd + dispatch gRPC (TCP)</text>

  <!-- VM box -->
  <rect x="500" y="50" width="380" height="400" rx="8" fill="#f6f3fa" stroke="#7d5ba6" stroke-width="1.5"/>
  <text x="516" y="74" font-weight="600" fill="#7d5ba6">Hyper-V utility VM (Alpine linux-virt)</text>

  <rect x="520" y="164" width="340" height="62" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="536" y="188" font-weight="600" fill="#222">kernel unpacks both cpio archives</text>
  <text x="536" y="210" fill="#444" font-size="13">tail files override /assets in the base</text>

  <rect x="520" y="238" width="340" height="62" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="536" y="262" font-weight="600" fill="#222">/init: modules, root VHDX, switch_root</text>
  <text x="536" y="284" fill="#444" font-size="13">rdinit=/init console=ttyS0,115200</text>

  <rect x="520" y="312" width="340" height="62" rx="6" fill="#fff" stroke="#e07a1f"/>
  <text x="536" y="336" font-weight="600" fill="#222">echo "EPHEMERD_IP=$MY_IP"</text>
  <text x="536" y="358" fill="#444" font-size="13">to ttyS0, which HCS maps to the pipe</text>

  <rect x="520" y="386" width="340" height="50" rx="6" fill="#fff" stroke="#3a9a5b"/>
  <text x="536" y="416" font-weight="600" fill="#222">ephemerd-linux: containerd + dispatch</text>

  <!-- arrows -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <line x1="400" y1="269" x2="518" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="518" y1="343" x2="402" y2="343" stroke="#e07a1f" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="402" y1="411" x2="518" y2="411" stroke="#3a9a5b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="690" y1="226" x2="690" y2="236" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="300" x2="690" y2="310" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="374" x2="690" y2="384" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="120" fill="#444" font-size="13">No WSL involved. The whole VM is</text>
  <text x="520" y="140" fill="#444" font-size="13">one JSON document handed to vmcompute.dll.</text>
</svg>

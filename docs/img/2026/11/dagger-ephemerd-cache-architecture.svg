<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 566" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A cold per-job engine, one shared cache for the fleet</title>
  <desc id="d">GitHub fires a workflow_job webhook at ephemerd on a node, which provisions a fresh VLAN-isolated runner that is destroyed after the job. Inside it a per-job BuildKit engine starts with an empty local cache, then imports from and exports to ephemerd's Actions-cache proxy over the GitHub Actions Cache v2 protocol. The proxy stores entries in a registry it is configured to use; pointing every ephemerd host at one shared registry:2 in the VLAN gives the whole fleet a single build cache, keyed by repo. The engines are thrown away; the cache is not.</desc>
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .lbl { fill: #222222; font-size: 15px; }
    .lblb { fill: #222222; font-size: 16px; font-weight: 600; }
    .sub { fill: #555555; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0550ae; }
    .arr { stroke: #555555; stroke-width: 2.5; fill: none; }
    .arrcold { stroke: #00707a; stroke-width: 2.5; fill: none; }
    .arrwarm { stroke: #0550ae; stroke-width: 2.5; fill: none; }
    .arrreg { stroke: #a0287f; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#555555"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#00707a"/></marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0550ae"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#a0287f"/></marker>
  </defs>

  <!-- GitHub -->
  <rect class="box" x="330" y="14" width="200" height="52" rx="10" stroke="#a0287f"/>
  <text class="lblb" x="430" y="38" text-anchor="middle" fill="#a0287f">GitHub</text>
  <text class="sub" x="430" y="57" text-anchor="middle">workflow_job webhook</text>

  <!-- Runner zone (ephemeral) -->
  <rect class="box" x="24" y="96" width="352" height="236" rx="12" stroke="#0550ae" stroke-dasharray="7 5"/>
  <text class="lblb" x="200" y="123" text-anchor="middle" fill="#0550ae">Fresh runner — one per job</text>
  <text class="sub" x="200" y="143" text-anchor="middle">VLAN 2 · egress fence · destroyed after the job</text>
  <rect class="box" x="50" y="164" width="300" height="42" rx="6"/>
  <text class="lbl" x="64" y="190">GitHub Actions job</text>
  <rect class="box" x="50" y="216" width="300" height="42" rx="6"/>
  <text class="lbl" x="64" y="242">buildkitd · per job · --privileged</text>
  <rect class="box" x="50" y="268" width="300" height="40" rx="6" stroke="#0550ae" stroke-dasharray="5 4"/>
  <text class="lbl" x="64" y="293">local build cache: <tspan font-weight="600">0 B (cold)</tspan></text>

  <!-- Node A zone -->
  <rect class="box" x="484" y="96" width="352" height="236" rx="12" stroke="#00707a"/>
  <text class="lblb" x="660" y="123" text-anchor="middle" fill="#00707a">ephemerd · node A</text>
  <text class="sub" x="660" y="143" text-anchor="middle">provisions the runner</text>
  <rect class="box" x="510" y="188" width="300" height="46" rx="6"/>
  <text class="lbl" x="524" y="216">Actions-cache proxy · GHA Cache v2</text>
  <text class="sub" x="660" y="268" text-anchor="middle">stores + fetches entries in the</text>
  <text class="sub" x="660" y="287" text-anchor="middle">registry it is pointed at  ↓</text>

  <!-- control-plane arrows -->
  <path class="arr" d="M470,56 C 560,70 660,80 660,94" marker-end="url(#a)"/>
  <text class="sub" x="566" y="76" fill="#555555">① webhook</text>
  <path class="arr" d="M484,176 H380" marker-end="url(#a)"/>
  <text class="sub" x="432" y="170" text-anchor="middle" fill="#555555">② provision</text>

  <!-- cache data-path arrows (buildkitd <-> proxy) -->
  <path class="arrcold" d="M508,224 H354" marker-end="url(#ac)"/>
  <text class="sub" x="431" y="218" text-anchor="middle" fill="#00707a">③ import</text>
  <path class="arrwarm" d="M354,250 H508" marker-end="url(#aw)"/>
  <text class="sub" x="431" y="268" text-anchor="middle" fill="#0550ae">④ export</text>

  <!-- shared registry cylinder (in the VLAN) -->
  <g transform="translate(248,402)">
    <path d="M0,16 a182,13 0 0 1 364,0 l0,62 a182,13 0 0 1 -364,0 Z" fill="#f7e9f1" stroke="#a0287f" stroke-width="2"/>
    <path d="M0,16 a182,13 0 0 0 364,0" fill="none" stroke="#a0287f" stroke-width="2"/>
    <text class="lblb" x="182" y="46" text-anchor="middle" fill="#a0287f">shared registry:2 — in the VLAN</text>
    <text class="sub" x="182" y="66" text-anchor="middle">one build cache for every host, keyed by repo</text>
    <text class="sub" x="182" y="84" text-anchor="middle">survives every job</text>
  </g>

  <!-- node A proxy -> shared registry -->
  <path class="arrreg" d="M636,234 C 600,320 540,360 500,414" marker-end="url(#ar)"/>
  <text class="sub" x="596" y="356" fill="#a0287f">store + fetch</text>

  <!-- other hosts -> same registry -->
  <rect class="box" x="36" y="420" width="176" height="86" rx="10" stroke="#00707a"/>
  <text class="lbl" x="124" y="450" text-anchor="middle" fill="#00707a">ephemerd · node B</text>
  <text class="sub" x="124" y="470" text-anchor="middle">node C · …</text>
  <text class="sub" x="124" y="488" text-anchor="middle">+ their own runners</text>
  <path class="arrreg" d="M214,462 H246" marker-end="url(#ar)"/>
  <text class="sub" x="150" y="412" text-anchor="middle" fill="#a0287f">every host points here</text>

  <!-- caption -->
  <text class="sub" x="430" y="548" text-anchor="middle">Throw the engine away each job; the cache lives in the registry. Share one registry and every cold engine warms from what any host built.</text>
</svg>

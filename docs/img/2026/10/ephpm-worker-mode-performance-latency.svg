<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 562" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Slowest 1% of requests near capacity</title>
  <desc id="d">Slowest 1% of requests (p99), log scale, median of five runs. ePHPm v0.11.3: 1493 ms at 55k, 4264 ms at 60k; ePHPm v0.12.0: 21.9 ms at 55k, 544 ms at 60k; v0.12.0, 24/16 threads: 14.1 ms at 55k, 103 ms at 60k; Swoole: 35.8 ms at 55k, 79.5 ms at 60k; Workerman, as shipped: 173 ms at 55k, 560 ms at 60k; Workerman, no recycle: 1116 ms at 55k, 5939 ms at 60k.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e3e3e3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b6b6b" stroke-width="3"/>
    </pattern>
    <pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f2f2f2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a8a8a8" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="860" height="562" fill="#ffffff"/>
  <text x="430.0" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Slowest 1% of requests near capacity</text>
  <text x="430.0" y="58" text-anchor="middle" font-size="15" fill="#555">p99 latency, median of five runs, log scale (shorter is better)</text>
  <line x1="250.0" y1="106" x2="250.0" y2="484" stroke="#ddd" stroke-width="1"/>
  <text x="250.0" y="98" font-size="13" fill="#555" text-anchor="middle">10 ms</text>
  <line x1="423.3" y1="106" x2="423.3" y2="484" stroke="#ddd" stroke-width="1"/>
  <text x="423.3" y="98" font-size="13" fill="#555" text-anchor="middle">100 ms</text>
  <line x1="596.7" y1="106" x2="596.7" y2="484" stroke="#ddd" stroke-width="1"/>
  <text x="596.7" y="98" font-size="13" fill="#555" text-anchor="middle">1 s</text>
  <line x1="770.0" y1="106" x2="770.0" y2="484" stroke="#ddd" stroke-width="1"/>
  <text x="770.0" y="98" font-size="13" fill="#555" text-anchor="middle">10 s</text>
  <text x="238" y="147" font-size="15" fill="#222" text-anchor="end">ePHPm v0.11.3</text>
  <rect x="250" y="120" width="376.8" height="19" fill="#9db8dc" fill-opacity="1"/>
  <text x="634.8" y="135" font-size="14" fill="#222">1.5 s <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="144" width="455.8" height="19" fill="#9db8dc" fill-opacity="0.55"/>
  <text x="713.8" y="159" font-size="14" fill="#222">4.3 s <tspan fill="#555">@ 60k</tspan></text>
  <text x="238" y="209" font-size="15" fill="#222" text-anchor="end" font-weight="600">ePHPm v0.12.0</text>
  <rect x="250" y="182" width="59.0" height="19" fill="#0550ae" fill-opacity="1"/>
  <text x="317.0" y="197" font-size="14" fill="#222">22 ms <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="206" width="300.8" height="19" fill="#0550ae" fill-opacity="0.55"/>
  <text x="558.8" y="221" font-size="14" fill="#222">544 ms <tspan fill="#555">@ 60k</tspan></text>
  <text x="238" y="271" font-size="15" fill="#222" text-anchor="end">v0.12.0, 24/16 threads</text>
  <rect x="250" y="244" width="25.9" height="19" fill="#2f74c8" fill-opacity="1"/>
  <text x="283.9" y="259" font-size="14" fill="#222">14 ms <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="268" width="175.6" height="19" fill="#2f74c8" fill-opacity="0.55"/>
  <text x="433.6" y="283" font-size="14" fill="#222">103 ms <tspan fill="#555">@ 60k</tspan></text>
  <text x="238" y="333" font-size="15" fill="#222" text-anchor="end">Swoole</text>
  <rect x="250" y="306" width="96.0" height="19" fill="url(#hatch)" fill-opacity="1" stroke="#555" stroke-width="1"/>
  <text x="354.0" y="321" font-size="14" fill="#222">36 ms <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="330" width="156.1" height="19" fill="url(#hatch)" fill-opacity="0.55" stroke="#555" stroke-width="1"/>
  <text x="414.1" y="345" font-size="14" fill="#222">80 ms <tspan fill="#555">@ 60k</tspan></text>
  <text x="238" y="395" font-size="15" fill="#222" text-anchor="end">Workerman, as shipped</text>
  <rect x="250" y="368" width="214.6" height="19" fill="url(#hatch2)" fill-opacity="1" stroke="#555" stroke-width="1"/>
  <text x="472.6" y="383" font-size="14" fill="#222">173 ms <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="392" width="303.0" height="19" fill="url(#hatch2)" fill-opacity="0.55" stroke="#555" stroke-width="1"/>
  <text x="561.0" y="407" font-size="14" fill="#222">560 ms <tspan fill="#555">@ 60k</tspan></text>
  <text x="238" y="457" font-size="15" fill="#222" text-anchor="end">Workerman, no recycle</text>
  <rect x="250" y="430" width="354.9" height="19" fill="url(#hatch)" fill-opacity="1" stroke="#555" stroke-width="1"/>
  <text x="612.9" y="445" font-size="14" fill="#222">1.1 s <tspan fill="#555">@ 55k</tspan></text>
  <rect x="250" y="454" width="480.8" height="19" fill="url(#hatch)" fill-opacity="0.55" stroke="#555" stroke-width="1"/>
  <text x="738.8" y="469" font-size="14" fill="#222">5.9 s <tspan fill="#555">@ 60k</tspan></text>
  <rect x="250" y="509" width="16" height="16" fill="#0550ae"/>
  <text x="274" y="522" font-size="15" fill="#222">55k requests/sec offered</text>
  <rect x="500" y="509" width="16" height="16" fill="#0550ae" fill-opacity="0.55"/>
  <text x="524" y="522" font-size="15" fill="#222">60k requests/sec offered</text>
</svg>

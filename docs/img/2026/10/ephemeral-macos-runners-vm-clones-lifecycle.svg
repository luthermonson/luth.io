<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">macOS VM job lifecycle and the single concurrency slot</title>
  <desc id="d">A vertical flow of a macOS CI job: clone the base image, boot the VM and grow its disk, set up over SSH, run the job, then stop and sweep the clone. A band on the left shows the single slot is held from clone until stop. A dashed box marks the provisioning phase, bounded by a 5 minute timeout so a wedged VM still frees the slot.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="380" height="560" fill="#ffffff"/>

  <!-- slot held band -->
  <rect x="14" y="70" width="26" height="400" rx="6" fill="#00707a" fill-opacity="0.12" stroke="#00707a" stroke-width="1.5"/>
  <text x="27" y="270" fill="#00707a" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 27 270)">slot held (max_concurrent = 1)</text>

  <!-- title -->
  <text x="200" y="26" fill="#111111" font-size="17" font-weight="700" text-anchor="middle">One macOS job, one VM, one slot</text>
  <text x="200" y="48" fill="#555555" font-size="13" text-anchor="middle">on an Apple-silicon Mac</text>

  <!-- step boxes -->
  <!-- 1 clone -->
  <rect x="60" y="70" width="300" height="56" rx="8" fill="#0550ae" fill-opacity="0.10" stroke="#0550ae" stroke-width="1.6"/>
  <text x="74" y="94" fill="#0550ae" font-size="15" font-weight="700">1. APFS clone of base.img</text>
  <text x="74" y="114" fill="#333333" font-size="13">copy-on-write, acquires the slot</text>

  <!-- dashed provisioning region around steps 2 and 3 -->
  <rect x="52" y="140" width="316" height="160" rx="10" fill="none" stroke="#a34700" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="360" y="156" fill="#a34700" font-size="13" font-weight="600" text-anchor="end">provisioning &#8212; 5m timeout</text>

  <!-- 2 boot -->
  <rect x="60" y="166" width="300" height="56" rx="8" fill="#0550ae" fill-opacity="0.10" stroke="#0550ae" stroke-width="1.6"/>
  <text x="74" y="190" fill="#0550ae" font-size="15" font-weight="700">2. Boot VM, truncate clone</text>
  <text x="74" y="210" fill="#333333" font-size="13">sparse grow on the host before boot</text>

  <!-- 3 ssh setup -->
  <rect x="60" y="236" width="300" height="56" rx="8" fill="#0550ae" fill-opacity="0.10" stroke="#0550ae" stroke-width="1.6"/>
  <text x="74" y="260" fill="#0550ae" font-size="15" font-weight="700">3. SSH setup</text>
  <text x="74" y="280" fill="#333333" font-size="13">resize APFS, stage cache-proxy env</text>

  <!-- 4 run -->
  <rect x="60" y="316" width="300" height="56" rx="8" fill="#a0287f" fill-opacity="0.10" stroke="#a0287f" stroke-width="1.6"/>
  <text x="74" y="340" fill="#a0287f" font-size="15" font-weight="700">4. Runner runs the job</text>
  <text x="74" y="360" fill="#333333" font-size="13">JIT runner, one job only</text>

  <!-- 5 stop -->
  <rect x="60" y="414" width="300" height="56" rx="8" fill="#a34700" fill-opacity="0.10" stroke="#a34700" stroke-width="1.6"/>
  <text x="74" y="438" fill="#a34700" font-size="15" font-weight="700">5. Stop, release slot, sweep clone</text>
  <text x="74" y="458" fill="#333333" font-size="13">release first, then tear down the files</text>

  <!-- arrows -->
  <line x1="210" y1="126" x2="210" y2="164" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="210" y1="222" x2="210" y2="234" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="210" y1="292" x2="210" y2="314" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="210" y1="372" x2="210" y2="412" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- footnote -->
  <text x="200" y="498" fill="#555555" font-size="12.5" text-anchor="middle">If step 2 or 3 wedges, the deadline force-stops the VM</text>
  <text x="200" y="516" fill="#555555" font-size="12.5" text-anchor="middle">and the slot is released anyway.</text>
</svg>

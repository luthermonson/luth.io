<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">ePHPm engine panics per round, before and after the fix</title>
  <desc id="d">Each round creates 200 fresh site databases with 32 concurrent first writes. Before, with stock Turso: bridge round 1 had 59 caught engine panics and bridge round 2 had 46. After, with the fix: bridge rounds 1, 2 and 3 had 0, and pdo_mysql rounds 1 and 2 had 0. All 1,000 databases from the five patched rounds pass integrity_check in Turso and sqlite3.</desc>
  <defs>
    <pattern id="hatcho" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f6e3d4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a34700" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="900" height="476" fill="#ffffff"/>
  <text x="450.0" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#222">ePHPm: engine panics per round</text>
  <text x="450.0" y="62" text-anchor="middle" font-size="15" fill="#555">200 fresh site databases per round, 32 concurrent first writes each</text>

  <text x="20" y="108" font-size="17" font-weight="600" fill="#222">Before: stock Turso</text>
  <text x="238" y="143" font-size="15" fill="#222" text-anchor="end">Bridge, round 1</text>
  <rect x="250" y="126" width="420.0" height="22" fill="url(#hatcho)" stroke="#a34700" stroke-width="1"/>
  <text x="678.0" y="143" font-size="15" fill="#222">59</text>
  <text x="238" y="177" font-size="15" fill="#222" text-anchor="end">Bridge, round 2</text>
  <rect x="250" y="160" width="327.5" height="22" fill="url(#hatcho)" stroke="#a34700" stroke-width="1"/>
  <text x="585.5" y="177" font-size="15" fill="#222">46</text>
  <line x1="250" y1="120" x2="250" y2="190" stroke="#333" stroke-width="1.5"/>

  <text x="20" y="234" font-size="17" font-weight="600" fill="#222">After: with the fix</text>
  <text x="238" y="269" font-size="15" fill="#222" text-anchor="end">Bridge, round 1</text>
  <text x="258" y="269" font-size="15" fill="#0550ae" font-weight="600">0</text>
  <text x="238" y="303" font-size="15" fill="#222" text-anchor="end">Bridge, round 2</text>
  <text x="258" y="303" font-size="15" fill="#0550ae" font-weight="600">0</text>
  <text x="238" y="337" font-size="15" fill="#222" text-anchor="end">Bridge, round 3</text>
  <text x="258" y="337" font-size="15" fill="#0550ae" font-weight="600">0</text>
  <text x="238" y="371" font-size="15" fill="#222" text-anchor="end">pdo_mysql, round 1</text>
  <text x="258" y="371" font-size="15" fill="#0550ae" font-weight="600">0</text>
  <text x="238" y="405" font-size="15" fill="#222" text-anchor="end">pdo_mysql, round 2</text>
  <text x="258" y="405" font-size="15" fill="#0550ae" font-weight="600">0</text>
  <line x1="250" y1="246" x2="250" y2="414" stroke="#333" stroke-width="1.5"/>

  <text x="450.0" y="454" text-anchor="middle" font-size="15" fill="#555">All 1,000 patched-round databases pass integrity_check in Turso and sqlite3.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">mayfly fleet overview</title>
  <desc id="d">mayfly reads one TOML file and provisions five runner pools. GitHub sends workflow_job webhooks through Cloudflare tunnels to ephemerd on each pool, and ephemerd starts one throwaway runner per job.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#222">mayfly: one config file, five pools, one runner per job</text>

  <!-- GitHub -->
  <rect x="30" y="80" width="170" height="96" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#222">GitHub</text>
  <text x="115" y="134" text-anchor="middle" font-size="12.5" fill="#333">workflow_job webhook</text>
  <text x="115" y="154" text-anchor="middle" font-size="12.5" fill="#333">JIT runner tokens</text>

  <!-- Cloudflare -->
  <rect x="260" y="80" width="190" height="96" rx="8" fill="#fdf3e1" stroke="#E69F00" stroke-width="2"/>
  <text x="355" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#8a5a00">Cloudflare tunnels</text>
  <text x="355" y="134" text-anchor="middle" font-size="12.5" fill="#333">one tunnel per pool</text>
  <text x="355" y="154" text-anchor="middle" font-size="12.5" fill="#333">no inbound ports</text>
  <line x1="200" y1="128" x2="256" y2="128" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>

  <!-- mayfly -->
  <rect x="660" y="70" width="270" height="116" rx="8" fill="#e6f1f8" stroke="#0072B2" stroke-width="2"/>
  <text x="795" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#0072B2">mayfly (my workstation)</text>
  <text x="795" y="122" text-anchor="middle" font-size="12.5" fill="#333">config.toml  ->  plan / apply</text>
  <text x="795" y="142" text-anchor="middle" font-size="12.5" fill="#333">Proxmox API + QEMU guest agent</text>
  <text x="795" y="162" text-anchor="middle" font-size="12.5" fill="#333">SSH for the bare-metal Mac</text>

  <!-- tunnel fan-out bus -->
  <line x1="355" y1="176" x2="355" y2="226" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="102" y1="226" x2="858" y2="226" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="102" y1="226" x2="102" y2="262" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>
  <line x1="291" y1="226" x2="291" y2="262" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>
  <line x1="480" y1="226" x2="480" y2="262" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>
  <line x1="669" y1="226" x2="669" y2="262" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>
  <line x1="858" y1="226" x2="858" y2="262" stroke="#D55E00" stroke-width="2.5" marker-end="url(#av)"/>
  <text x="560" y="216" font-size="12.5" fill="#D55E00">every pool gets every event; each claims only its own labels</text>

  <!-- mayfly provisions (dashed blue) -->
  <path d="M930,128 L950,128 L950,252 L14,252" fill="none" stroke="#0072B2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="944" y="246" text-anchor="end" font-size="12" fill="#0072B2">mayfly provisions + upgrades every pool</text>

  <!-- pools -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="20" y="266" width="164" height="150" rx="8" fill="#e8f5ef" stroke="#009E73" stroke-width="2"/>
    <text x="102" y="290" font-size="14.5" font-weight="600" fill="#00664a">linux-amd64</text>
    <text x="102" y="310">32-thread box</text>
    <text x="102" y="328">30 vCPU / 48 GB</text>
    <text x="102" y="346">ephemerd, 3 slots</text>

    <rect x="209" y="266" width="164" height="150" rx="8" fill="#e8f5ef" stroke="#009E73" stroke-width="2"/>
    <text x="291" y="290" font-size="14.5" font-weight="600" fill="#00664a">linux-amd64</text>
    <text x="291" y="310">old 4-core i7-6700</text>
    <text x="291" y="328">8 vCPU / 48 GB</text>
    <text x="291" y="346">ephemerd, 1 slot</text>

    <rect x="398" y="266" width="164" height="150" rx="8" fill="#e8f5ef" stroke="#009E73" stroke-width="2"/>
    <text x="480" y="290" font-size="14.5" font-weight="600" fill="#00664a">linux-arm64</text>
    <text x="480" y="310">Minisforum MS-R1</text>
    <text x="480" y="328">10 vCPU / 40 GB</text>
    <text x="480" y="346">ephemerd, 5 slots</text>

    <rect x="587" y="266" width="164" height="150" rx="8" fill="#e8f5ef" stroke="#009E73" stroke-width="2"/>
    <text x="669" y="290" font-size="14.5" font-weight="600" fill="#00664a">win-amd64</text>
    <text x="669" y="310">Windows Server 2025</text>
    <text x="669" y="328">8 vCPU / 24 GB</text>
    <text x="669" y="346">ephemerd, 2 slots</text>

    <rect x="776" y="266" width="164" height="150" rx="8" fill="#f8eef4" stroke="#CC79A7" stroke-width="2"/>
    <text x="858" y="290" font-size="14.5" font-weight="600" fill="#8f3d6c">mac-arm64</text>
    <text x="858" y="310">8 GB M1 Mac mini</text>
    <text x="858" y="328">bare metal, via SSH</text>
    <text x="858" y="346">ephemerd, 1 slot</text>
  </g>

  <!-- job boxes inside pools -->
  <g font-size="11.5" fill="#222" text-anchor="middle">
    <rect x="34" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="55" y="386">job</text>
    <rect x="81" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="102" y="386">job</text>
    <rect x="128" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="149" y="386">job</text>

    <rect x="270" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="291" y="386">job</text>

    <rect x="406" y="362" width="26" height="40" rx="4" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>
    <rect x="436" y="362" width="26" height="40" rx="4" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>
    <rect x="466" y="362" width="26" height="40" rx="4" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>
    <rect x="496" y="362" width="26" height="40" rx="4" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>
    <rect x="526" y="362" width="26" height="40" rx="4" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>

    <rect x="620" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="641" y="386">job</text>
    <rect x="676" y="362" width="42" height="40" rx="5" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/><text x="697" y="386">job</text>

    <rect x="822" y="362" width="72" height="40" rx="5" fill="#fff" stroke="#CC79A7" stroke-dasharray="3 2"/><text x="858" y="380">job VM</text><text x="858" y="395" font-size="10.5" fill="#555">5 GB</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#333">
    <rect x="30" y="448" width="22" height="16" rx="3" fill="#fff" stroke="#009E73" stroke-dasharray="3 2"/>
    <text x="60" y="461">one throwaway runner per job: a container on Linux and Windows, a VM on macOS, destroyed when the job ends</text>
    <line x1="30" y1="488" x2="52" y2="488" stroke="#D55E00" stroke-width="2.5"/>
    <text x="60" y="492">webhooks in (outbound tunnels)</text>
    <line x1="290" y1="488" x2="312" y2="488" stroke="#0072B2" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="320" y="492">mayfly reconciling the hosts</text>
  </g>
</svg>

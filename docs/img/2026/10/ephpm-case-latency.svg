<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="540" height="350" fill="#ffffff"/>
  <text x="270" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Response time — lower is better (ms)</text>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="70" y1="280" x2="510" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <!-- gridlines + y labels (0.23 px/ms; baseline y=280) -->
  <line x1="70" y1="222.5" x2="510" y2="222.5" stroke="#e5e7eb"/><text x="64" y="227" text-anchor="end" font-size="11" fill="#6b7280">250</text>
  <line x1="70" y1="165" x2="510" y2="165" stroke="#e5e7eb"/><text x="64" y="169" text-anchor="end" font-size="11" fill="#6b7280">500</text>
  <line x1="70" y1="107.5" x2="510" y2="107.5" stroke="#e5e7eb"/><text x="64" y="112" text-anchor="end" font-size="11" fill="#6b7280">750</text>
  <line x1="70" y1="50" x2="510" y2="50" stroke="#e5e7eb"/><text x="64" y="54" text-anchor="end" font-size="11" fill="#6b7280">1000</text>
  <!-- p50 group -->
  <rect x="110" y="202" width="60" height="78" fill="#c2410c"/><text x="140" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">339</text>
  <rect x="175" y="223" width="60" height="57" fill="#15803d"/><text x="205" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">248</text>
  <text x="172" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">p50</text>
  <!-- p95 group -->
  <rect x="320" y="67" width="60" height="213" fill="#c2410c"/><text x="350" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">928</text>
  <rect x="385" y="88" width="60" height="192" fill="#15803d"/><text x="415" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">834</text>
  <text x="382" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">p95</text>
  <!-- legend -->
  <rect x="150" y="320" width="14" height="14" fill="#c2410c"/><text x="170" y="332" font-size="12" fill="#374151">RDS (2 boxes)</text>
  <rect x="300" y="320" width="14" height="14" fill="#15803d"/><text x="320" y="332" font-size="12" fill="#374151">ePHPm+Turso (1 box)</text>
</svg>

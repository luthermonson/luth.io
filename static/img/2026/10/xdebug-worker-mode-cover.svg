<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/></marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Worker mode with Xdebug: route, don't reset</text>
  <!-- requests -->
  <rect x="30" y="150" width="150" height="110" rx="8" fill="#f4f4f4" stroke="#6b6b6b"/>
  <text x="105" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#222">HTTP request</text>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#444">query string</text>
  <text x="105" y="222" text-anchor="middle" font-size="12" fill="#444">urlencoded body</text>
  <text x="105" y="240" text-anchor="middle" font-size="12" fill="#444">Cookie header</text>
  <!-- router -->
  <rect x="230" y="140" width="190" height="130" rx="8" fill="#eaf1f9" stroke="#2b6cb0" stroke-width="2"/>
  <text x="325" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#2b6cb0">Router (Rust)</text>
  <text x="325" y="196" text-anchor="middle" font-size="12" fill="#333">xdebug_trigger.rs</text>
  <text x="325" y="216" text-anchor="middle" font-size="12" fill="#333">mirrors Xdebug 3.5.3</text>
  <text x="325" y="234" text-anchor="middle" font-size="12" fill="#333">trigger_enabled()</text>
  <text x="325" y="254" text-anchor="middle" font-size="12" fill="#333">no PHP runs here</text>
  <line x1="180" y1="205" x2="226" y2="205" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/>
  <!-- warm pool -->
  <rect x="490" y="70" width="380" height="140" rx="8" fill="#edf7f0" stroke="#3a9a5b" stroke-width="2"/>
  <text x="680" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#3a9a5b">Warm worker pool</text>
  <text x="680" y="120" text-anchor="middle" font-size="12" fill="#333">booted once, take_request() loop</text>
  <rect x="510" y="135" width="105" height="56" rx="6" fill="#fff" stroke="#3a9a5b"/>
  <text x="562" y="160" text-anchor="middle" font-size="12" fill="#333">worker 1</text>
  <text x="562" y="178" text-anchor="middle" font-size="11" fill="#666">request #N</text>
  <rect x="628" y="135" width="105" height="56" rx="6" fill="#fff" stroke="#3a9a5b"/>
  <text x="680" y="160" text-anchor="middle" font-size="12" fill="#333">worker 2</text>
  <text x="680" y="178" text-anchor="middle" font-size="11" fill="#666">request #N</text>
  <rect x="746" y="135" width="105" height="56" rx="6" fill="#fff" stroke="#3a9a5b"/>
  <text x="798" y="160" text-anchor="middle" font-size="12" fill="#333">worker n</text>
  <text x="798" y="178" text-anchor="middle" font-size="11" fill="#666">request #N</text>
  <line x1="420" y1="180" x2="486" y2="140" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/>
  <text x="432" y="138" font-size="12" fill="#3a9a5b">no trigger</text>
  <!-- debug lane -->
  <rect x="490" y="250" width="380" height="170" rx="8" fill="#fdf2e8" stroke="#e07a1f" stroke-width="2"/>
  <text x="680" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#e07a1f">Debug lane (debug_workers = 1)</text>
  <text x="510" y="304" font-size="12" fill="#333">1. fresh thread, SG(request_info) pre-seeded</text>
  <text x="510" y="324" font-size="12" fill="#333">2. php_request_startup(): Xdebug RINIT sees trigger</text>
  <text x="510" y="344" font-size="12" fill="#333">3. framework boots inside the DBGp session</text>
  <text x="510" y="364" font-size="12" fill="#333">4. one take_request() / send_response()</text>
  <text x="510" y="384" font-size="12" fill="#333">5. php_request_shutdown(): clean "stopping"</text>
  <text x="510" y="404" font-size="12" fill="#666">thread retires (max_requests = 1)</text>
  <line x1="420" y1="232" x2="486" y2="290" stroke="#e07a1f" stroke-width="2" marker-end="url(#ao)"/>
  <text x="408" y="290" font-size="12" fill="#e07a1f">trigger</text>
  <!-- IDE -->
  <rect x="230" y="345" width="190" height="70" rx="8" fill="#f3eff8" stroke="#7d5ba6" stroke-width="2"/>
  <text x="325" y="374" text-anchor="middle" font-size="15" font-weight="600" fill="#7d5ba6">IDE</text>
  <text x="325" y="396" text-anchor="middle" font-size="12" fill="#333">DBGp on :9003</text>
  <line x1="490" y1="340" x2="424" y2="372" stroke="#7d5ba6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
</svg>

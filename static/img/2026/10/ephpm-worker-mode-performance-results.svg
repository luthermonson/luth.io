<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 894" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">ePHPm v0.12.0 against v0.11.3, Swoole and Workerman</title>
  <desc id="d">Requests/sec at 65k offered (higher is better): ePHPm v0.11.3 51,417; ePHPm v0.12.0 58,101; v0.12.0, 24/16 threads 60,492; Swoole 61,279; Workerman, no recycle 63,021; Workerman, as shipped 64,510. CPU per request, µs (lower is better): ePHPm v0.11.3 354 µs; ePHPm v0.12.0 337 µs; v0.12.0, 24/16 threads 336 µs; Swoole 297 µs; Workerman, no recycle 272 µs; Workerman, as shipped 272 µs. Peak container memory, MiB (lower is better): ePHPm v0.11.3 358 MiB; ePHPm v0.12.0 153 MiB; v0.12.0, 24/16 threads 152 MiB; Swoole 99 MiB; Workerman, no recycle 112 MiB; Workerman, as shipped 92 MiB. Workerman as shipped had about 3,100 read errors per 30-second test.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e3e3e3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b6b6b" stroke-width="3"/>
    </pattern>
    <pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f2f2f2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a8a8a8" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="900" height="894" fill="#ffffff"/>
  <text x="450.0" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#222">ePHPm v0.12.0 vs Swoole and Workerman, worker mode</text>
  <text x="450.0" y="62" text-anchor="middle" font-size="15" fill="#555">Yii3 app-api home page; PHP 8.5.11 everywhere; mean of five runs</text>
  <text x="20" y="108" font-size="17" font-weight="600" fill="#222">Requests/sec at 65k offered (higher is better)</text>
  <text x="238" y="143" font-size="15" fill="#222" text-anchor="end">ePHPm v0.11.3</text>
  <rect x="250" y="126" width="335.0" height="22" fill="#9db8dc"/>
  <text x="593.0" y="143" font-size="15" fill="#222">51,417</text>
  <text x="238" y="177" font-size="15" fill="#222" text-anchor="end" font-weight="600">ePHPm v0.12.0</text>
  <rect x="250" y="160" width="378.5" height="22" fill="#0550ae"/>
  <text x="636.5" y="177" font-size="15" fill="#222" font-weight="600">58,101</text>
  <text x="238" y="211" font-size="15" fill="#222" text-anchor="end">v0.12.0, 24/16 threads</text>
  <rect x="250" y="194" width="394.1" height="22" fill="#2f74c8"/>
  <text x="652.1" y="211" font-size="15" fill="#222">60,492</text>
  <text x="238" y="245" font-size="15" fill="#222" text-anchor="end">Swoole</text>
  <rect x="250" y="228" width="399.2" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="657.2" y="245" font-size="15" fill="#222">61,279</text>
  <text x="238" y="279" font-size="15" fill="#222" text-anchor="end">Workerman, no recycle</text>
  <rect x="250" y="262" width="410.6" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="668.6" y="279" font-size="15" fill="#222">63,021</text>
  <text x="238" y="313" font-size="15" fill="#222" text-anchor="end">Workerman, as shipped</text>
  <rect x="250" y="296" width="420.3" height="22" fill="url(#hatch2)" stroke="#555" stroke-width="1"/>
  <text x="678.3" y="313" font-size="15" fill="#222">64,510  (3,100 errors per test)</text>
  <line x1="250" y1="120" x2="250" y2="324" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="374" font-size="17" font-weight="600" fill="#222">CPU per request, µs (lower is better)</text>
  <text x="238" y="409" font-size="15" fill="#222" text-anchor="end">ePHPm v0.11.3</text>
  <rect x="250" y="392" width="380.6" height="22" fill="#9db8dc"/>
  <text x="638.5" y="409" font-size="15" fill="#222">354 µs</text>
  <text x="238" y="443" font-size="15" fill="#222" text-anchor="end" font-weight="600">ePHPm v0.12.0</text>
  <rect x="250" y="426" width="362.3" height="22" fill="#0550ae"/>
  <text x="620.3" y="443" font-size="15" fill="#222" font-weight="600">337 µs</text>
  <text x="238" y="477" font-size="15" fill="#222" text-anchor="end">v0.12.0, 24/16 threads</text>
  <rect x="250" y="460" width="361.2" height="22" fill="#2f74c8"/>
  <text x="619.2" y="477" font-size="15" fill="#222">336 µs</text>
  <text x="238" y="511" font-size="15" fill="#222" text-anchor="end">Swoole</text>
  <rect x="250" y="494" width="319.3" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="577.3" y="511" font-size="15" fill="#222">297 µs</text>
  <text x="238" y="545" font-size="15" fill="#222" text-anchor="end">Workerman, no recycle</text>
  <rect x="250" y="528" width="292.4" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="550.4" y="545" font-size="15" fill="#222">272 µs</text>
  <text x="238" y="579" font-size="15" fill="#222" text-anchor="end">Workerman, as shipped</text>
  <rect x="250" y="562" width="292.4" height="22" fill="url(#hatch2)" stroke="#555" stroke-width="1"/>
  <text x="550.4" y="579" font-size="15" fill="#222">272 µs</text>
  <line x1="250" y1="386" x2="250" y2="590" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="640" font-size="17" font-weight="600" fill="#222">Peak container memory, MiB (lower is better)</text>
  <text x="238" y="675" font-size="15" fill="#222" text-anchor="end">ePHPm v0.11.3</text>
  <rect x="250" y="658" width="384.9" height="22" fill="#9db8dc"/>
  <text x="642.9" y="675" font-size="15" fill="#222">358 MiB</text>
  <text x="238" y="709" font-size="15" fill="#222" text-anchor="end" font-weight="600">ePHPm v0.12.0</text>
  <rect x="250" y="692" width="164.5" height="22" fill="#0550ae"/>
  <text x="422.5" y="709" font-size="15" fill="#222" font-weight="600">153 MiB</text>
  <text x="238" y="743" font-size="15" fill="#222" text-anchor="end">v0.12.0, 24/16 threads</text>
  <rect x="250" y="726" width="163.4" height="22" fill="#2f74c8"/>
  <text x="421.4" y="743" font-size="15" fill="#222">152 MiB</text>
  <text x="238" y="777" font-size="15" fill="#222" text-anchor="end">Swoole</text>
  <rect x="250" y="760" width="106.4" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="364.4" y="777" font-size="15" fill="#222">99 MiB</text>
  <text x="238" y="811" font-size="15" fill="#222" text-anchor="end">Workerman, no recycle</text>
  <rect x="250" y="794" width="120.4" height="22" fill="url(#hatch)" stroke="#555" stroke-width="1"/>
  <text x="378.4" y="811" font-size="15" fill="#222">112 MiB</text>
  <text x="238" y="845" font-size="15" fill="#222" text-anchor="end">Workerman, as shipped</text>
  <rect x="250" y="828" width="98.9" height="22" fill="url(#hatch2)" stroke="#555" stroke-width="1"/>
  <text x="356.9" y="845" font-size="15" fill="#222">92 MiB</text>
  <line x1="250" y1="652" x2="250" y2="856" stroke="#333" stroke-width="1.5"/>
</svg>

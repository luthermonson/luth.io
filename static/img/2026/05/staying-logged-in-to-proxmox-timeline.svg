<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#222">A ticket's life (PVE ticket_lifetime = 2h)</text>
  <!-- axis -->
  <line x1="80" y1="150" x2="900" y2="150" stroke="#444" stroke-width="2"/>
  <g font-size="13" fill="#222" text-anchor="middle">
    <line x1="80" y1="142" x2="80" y2="158" stroke="#444" stroke-width="2"/><text x="80" y="178">0h login</text>
    <line x1="353" y1="142" x2="353" y2="158" stroke="#444" stroke-width="2"/><text x="353" y="178">1h</text>
    <line x1="626" y1="142" x2="626" y2="158" stroke="#444" stroke-width="2"/><text x="626" y="178">2h</text>
    <line x1="900" y1="142" x2="900" y2="158" stroke="#444" stroke-width="2"/><text x="900" y="178">3h</text>
  </g>
  <!-- server validity -->
  <rect x="80" y="70" width="546" height="26" rx="4" fill="#3a9a5b" opacity="0.85"/>
  <text x="353" y="88" text-anchor="middle" font-size="13" fill="#fff">server accepts the ticket (and accepts it as a password for renewal)</text>
  <rect x="626" y="70" width="274" height="26" rx="4" fill="#c0392b" opacity="0.85"/>
  <text x="763" y="88" text-anchor="middle" font-size="13" fill="#fff">401, renewal impossible</text>
  <!-- client view -->
  <rect x="80" y="104" width="273" height="26" rx="4" fill="#2b6cb0" opacity="0.85"/>
  <text x="216" y="122" text-anchor="middle" font-size="13" fill="#fff">client: sessionExpiresAt not reached</text>
  <rect x="353" y="104" width="547" height="26" rx="4" fill="#6b6b6b" opacity="0.85"/>
  <text x="626" y="122" text-anchor="middle" font-size="13" fill="#fff">client considers it stale, will renew on the next 401</text>
  <!-- annotations -->
  <rect x="380" y="206" width="230" height="58" rx="8" fill="#eaf5ee" stroke="#3a9a5b"/>
  <text x="495" y="230" text-anchor="middle" font-size="13" fill="#222">RefreshTicket() here works</text>
  <text x="495" y="250" text-anchor="middle" font-size="12" fill="#6b6b6b">old ticket POSTed as the password</text>
  <line x1="495" y1="206" x2="495" y2="156" stroke="#3a9a5b" stroke-dasharray="4 3"/>
  <rect x="650" y="206" width="260" height="58" rx="8" fill="#fbeceb" stroke="#c0392b"/>
  <text x="780" y="230" text-anchor="middle" font-size="13" fill="#222">first 401 arrives here</text>
  <text x="780" y="250" text-anchor="middle" font-size="12" fill="#6b6b6b">renewal fails, falls back to password</text>
  <line x1="680" y1="206" x2="650" y2="156" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="480" y="306" text-anchor="middle" font-size="12" fill="#6b6b6b">a long-running process that only has a ticket (OTP login, WithSession) has to renew before 2h on its own</text>
</svg>

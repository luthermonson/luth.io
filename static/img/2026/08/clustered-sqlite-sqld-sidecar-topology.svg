<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a9a5b"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fff"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#222">Clustered SQLite in ePHPm v0.6.x: replication by sidecar</text>

  <!-- Node A -->
  <rect x="30" y="55" width="370" height="400" rx="10" fill="#f6f8fb" stroke="#6b6b6b"/>
  <text x="45" y="80" font-size="15" font-weight="600" fill="#222">node-a (elected primary)</text>
  <rect x="50" y="95" width="330" height="170" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="65" y="117" font-size="14" font-weight="600" fill="#2b6cb0">ephpm process</text>
  <rect x="65" y="128" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="135" y="153" text-anchor="middle" font-size="13" fill="#222">PHP (pdo_mysql)</text>
  <rect x="225" y="128" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="295" y="153" text-anchor="middle" font-size="13" fill="#222">litewire</text>
  <line x1="205" y1="148" x2="223" y2="148" stroke="#333" marker-end="url(#a)"/>
  <rect x="225" y="190" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="295" y="215" text-anchor="middle" font-size="13" fill="#222">Hrana HTTP client</text>
  <line x1="295" y1="168" x2="295" y2="188" stroke="#333" marker-end="url(#a)"/>
  <rect x="65" y="190" width="140" height="60" rx="5" fill="#fdf3e9" stroke="#e07a1f"/>
  <text x="135" y="213" text-anchor="middle" font-size="13" fill="#222">election loop</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#6b6b6b">restart(new_role)</text>

  <rect x="50" y="300" width="330" height="70" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="65" y="323" font-size="14" font-weight="600" fill="#e07a1f">sqld child process (primary)</text>
  <text x="65" y="345" font-size="12" fill="#6b6b6b">extracted from include_bytes!() at startup</text>
  <text x="65" y="362" font-size="12" fill="#6b6b6b">--grpc-listen-addr</text>
  <line x1="295" y1="230" x2="295" y2="298" stroke="#333" marker-end="url(#a)"/>
  <text x="302" y="268" font-size="12" fill="#333">HTTP</text>
  <line x1="135" y1="250" x2="135" y2="298" stroke="#e07a1f" stroke-dasharray="4 3" marker-end="url(#ao)"/>
  <text x="142" y="280" font-size="12" fill="#e07a1f">SIGTERM + respawn</text>
  <rect x="150" y="395" width="130" height="40" rx="5" fill="#eef7f1" stroke="#3a9a5b"/>
  <text x="215" y="420" text-anchor="middle" font-size="13" fill="#222">app.db (WAL)</text>
  <line x1="215" y1="370" x2="215" y2="393" stroke="#333" marker-end="url(#a)"/>

  <!-- Node B -->
  <rect x="520" y="55" width="370" height="400" rx="10" fill="#f6f8fb" stroke="#6b6b6b"/>
  <text x="535" y="80" font-size="15" font-weight="600" fill="#222">node-b (replica)</text>
  <rect x="540" y="95" width="330" height="170" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="555" y="117" font-size="14" font-weight="600" fill="#2b6cb0">ephpm process</text>
  <rect x="555" y="128" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="625" y="153" text-anchor="middle" font-size="13" fill="#222">PHP (pdo_mysql)</text>
  <rect x="715" y="128" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="785" y="153" text-anchor="middle" font-size="13" fill="#222">litewire</text>
  <line x1="695" y1="148" x2="713" y2="148" stroke="#333" marker-end="url(#a)"/>
  <rect x="715" y="190" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#2b6cb0"/>
  <text x="785" y="215" text-anchor="middle" font-size="13" fill="#222">Hrana HTTP client</text>
  <line x1="785" y1="168" x2="785" y2="188" stroke="#333" marker-end="url(#a)"/>
  <rect x="555" y="190" width="140" height="60" rx="5" fill="#fdf3e9" stroke="#e07a1f"/>
  <text x="625" y="213" text-anchor="middle" font-size="13" fill="#222">election loop</text>
  <text x="625" y="232" text-anchor="middle" font-size="12" fill="#6b6b6b">restart(new_role)</text>

  <rect x="540" y="300" width="330" height="70" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="555" y="323" font-size="14" font-weight="600" fill="#e07a1f">sqld child process (replica)</text>
  <text x="555" y="345" font-size="12" fill="#6b6b6b">--primary-grpc-url</text>
  <text x="555" y="362" font-size="12" fill="#6b6b6b">syncs WAL frames, forwards writes</text>
  <line x1="785" y1="230" x2="785" y2="298" stroke="#333" marker-end="url(#a)"/>
  <text x="792" y="268" font-size="12" fill="#333">HTTP</text>
  <line x1="625" y1="250" x2="625" y2="298" stroke="#e07a1f" stroke-dasharray="4 3" marker-end="url(#ao)"/>
  <rect x="640" y="395" width="130" height="40" rx="5" fill="#eef7f1" stroke="#3a9a5b"/>
  <text x="705" y="420" text-anchor="middle" font-size="13" fill="#222">app.db (WAL)</text>
  <line x1="705" y1="370" x2="705" y2="393" stroke="#333" marker-end="url(#a)"/>

  <!-- inter-node links -->
  <line x1="382" y1="335" x2="538" y2="335" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="460" y="327" text-anchor="middle" font-size="12" fill="#c0392b">sqld gRPC</text>
  <text x="460" y="352" text-anchor="middle" font-size="11" fill="#c0392b">WAL frames / writes</text>

  <line x1="382" y1="215" x2="538" y2="215" stroke="#3a9a5b" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="460" y="207" text-anchor="middle" font-size="12" fill="#3a9a5b">gossip UDP 7946</text>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#3a9a5b">kv:sqlite:primary claim</text>

  <line x1="382" y1="125" x2="538" y2="125" stroke="#7d5ba6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="460" y="117" text-anchor="middle" font-size="12" fill="#7d5ba6">KV data plane TCP 7947</text>

  <text x="460" y="485" text-anchor="middle" font-size="12" fill="#6b6b6b">Five moving parts per node pair: gossip, KV data plane, sqld gRPC, Hrana HTTP, and a child process per node.</text>
</svg>

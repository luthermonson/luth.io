<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Two middleware lanes in ePHPm</text>
  <!-- timeline -->
  <line x1="40" y1="200" x2="860" y2="200" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="245" font-size="12" fill="#6b6b6b">request arrives</text>
  <text x="860" y="185" text-anchor="end" font-size="12" fill="#6b6b6b">response</text>
  <!-- phases -->
  <rect x="70" y="180" width="170" height="40" rx="6" fill="#eaf1f9" stroke="#2b6cb0" stroke-width="2"/>
  <text x="155" y="205" text-anchor="middle" font-size="13" fill="#2b6cb0" font-weight="600">headers parsed</text>
  <rect x="300" y="180" width="140" height="40" rx="6" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-size="13" fill="#444" font-weight="600">body read</text>
  <rect x="490" y="180" width="350" height="40" rx="6" fill="#edf7f0" stroke="#3a9a5b" stroke-width="2"/>
  <text x="665" y="205" text-anchor="middle" font-size="13" fill="#3a9a5b" font-weight="600">one PHP request</text>
  <!-- native lane -->
  <rect x="60" y="70" width="230" height="80" rx="8" fill="#fdf2e8" stroke="#e07a1f" stroke-width="2"/>
  <text x="175" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#e07a1f">native lane (C ABI)</text>
  <text x="175" y="118" text-anchor="middle" font-size="12" fill="#333">dlopen .so / builtin / Rust / elephc</text>
  <text x="175" y="136" text-anchor="middle" font-size="12" fill="#333">can reject before the body</text>
  <line x1="200" y1="150" x2="230" y2="178" stroke="#e07a1f" stroke-width="2" marker-end="url(#a)"/>
  <!-- php lane -->
  <rect x="500" y="250" width="160" height="90" rx="8" fill="#f3eff8" stroke="#7d5ba6" stroke-width="2"/>
  <text x="580" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#7d5ba6">php: mounts</text>
  <text x="580" y="298" text-anchor="middle" font-size="12" fill="#333">auto_prepend_file's spot</text>
  <text x="580" y="316" text-anchor="middle" font-size="12" fill="#333">same superglobals,</text>
  <text x="580" y="332" text-anchor="middle" font-size="12" fill="#333">open_basedir, KV, timer</text>
  <line x1="560" y1="250" x2="540" y2="222" stroke="#7d5ba6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="690" y="250" width="150" height="90" rx="8" fill="#ffffff" stroke="#3a9a5b" stroke-width="2"/>
  <text x="765" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#3a9a5b">index.php</text>
  <text x="765" y="312" text-anchor="middle" font-size="12" fill="#333">the application</text>
  <line x1="765" y1="250" x2="765" y2="222" stroke="#3a9a5b" stroke-width="2" marker-end="url(#a)"/>
</svg>

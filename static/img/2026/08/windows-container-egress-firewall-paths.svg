<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <rect width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a9a5b"/>
    </marker>
  </defs>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Where a Windows container's outbound packet actually goes</text>

  <!-- NAT section -->
  <text x="20" y="64" font-weight="600" fill="#c0392b">Default HNS NAT network: five filters, zero hits</text>

  <rect x="20" y="80" width="170" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="105" y="106" text-anchor="middle" font-weight="600" fill="#222">job container</text>
  <text x="105" y="126" text-anchor="middle" fill="#444" font-size="13">Hyper-V isolated</text>
  <text x="105" y="143" text-anchor="middle" fill="#444" font-size="13">src 10.88.x.x</text>

  <rect x="240" y="80" width="190" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="335" y="106" text-anchor="middle" font-weight="600" fill="#222">vSwitch port</text>
  <text x="335" y="126" text-anchor="middle" fill="#444" font-size="13">VFP not engaged on NAT</text>

  <rect x="480" y="80" width="230" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="595" y="106" text-anchor="middle" font-weight="600" fill="#222">HNS NAT in vSwitch datapath</text>
  <text x="595" y="126" text-anchor="middle" fill="#444" font-size="13">SNAT to the host's LAN IP</text>

  <rect x="760" y="80" width="200" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="860" y="106" text-anchor="middle" font-weight="600" fill="#222">LAN NIC</text>
  <text x="860" y="126" text-anchor="middle" fill="#c0392b" font-size="13">reaches 10.0.x.x targets</text>

  <line x1="190" y1="115" x2="238" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="430" y1="115" x2="478" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="115" x2="758" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- host stack, off path -->
  <rect x="480" y="200" width="480" height="120" rx="8" fill="#fbf1f0" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="496" y="224" font-weight="600" fill="#222">host tcpip.sys + WFP (the packet never comes through here)</text>
  <text x="496" y="248" fill="#444" font-size="13">1. Windows Firewall, localip=10.88.0.0/16: never matched</text>
  <text x="496" y="270" fill="#444" font-size="13">5. WFP IPFORWARD / IPPACKET, 7 filters: none matched</text>
  <text x="496" y="292" fill="#444" font-size="13">   positive control: same filter on host traffic did block</text>
  <text x="496" y="312" fill="#444" font-size="13">   Get-NetNat empty, Forwarding Disabled on both interfaces</text>
  <line x1="595" y1="152" x2="595" y2="198" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>

  <rect x="20" y="200" width="430" height="120" rx="8" fill="#fbf1f0" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="36" y="224" font-weight="600" fill="#222">attempts on or in the container</text>
  <text x="36" y="248" fill="#444" font-size="13">2. Hyper-V firewall: no container VMCreator ever registered</text>
  <text x="36" y="270" fill="#444" font-size="13">3. HNS endpoint ACLs: present on the endpoint, never enforced</text>
  <text x="36" y="292" fill="#444" font-size="13">4a. route blackhole: answered by the gateway's proxy-ARP</text>
  <text x="36" y="312" fill="#444" font-size="13">4b. in-container firewall: BFE / MpsSvc won't start</text>

  <!-- L2Bridge section -->
  <line x1="20" y1="350" x2="960" y2="350" stroke="#ddd"/>
  <text x="20" y="384" font-weight="600" fill="#3a9a5b">L2Bridge network (network.l2bridge_egress = true): VFP engaged</text>

  <rect x="20" y="400" width="170" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="105" y="426" text-anchor="middle" font-weight="600" fill="#222">job container</text>
  <text x="105" y="446" text-anchor="middle" fill="#444" font-size="13">LAN address from</text>
  <text x="105" y="463" text-anchor="middle" fill="#444" font-size="13">network.ip_pool</text>

  <rect x="240" y="400" width="470" height="180" rx="6" fill="#f2f8f4" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="256" y="424" font-weight="600" fill="#222">vSwitch port: VFP Switch ACLs (lower priority wins)</text>
  <text x="256" y="450" fill="#444" font-size="13" font-family="ui-monospace, Consolas, monospace">  90 Allow Out  host /32 (only if dind / proxies on)</text>
  <text x="256" y="472" fill="#444" font-size="13" font-family="ui-monospace, Consolas, monospace">  95 Allow Out  operator carve-outs (default none)</text>
  <text x="256" y="494" fill="#c0392b" font-size="13" font-family="ui-monospace, Consolas, monospace"> 100 Block Out  10/8 172.16/12 192.168/16 169.254/16</text>
  <text x="256" y="516" fill="#444" font-size="13" font-family="ui-monospace, Consolas, monospace">65500 Allow Out 0.0.0.0/0</text>
  <text x="256" y="538" fill="#3a9a5b" font-size="13" font-weight="600" font-family="ui-monospace, Consolas, monospace">65500 Allow In  0.0.0.0/0   (or SYN-ACKs die)</text>
  <text x="256" y="564" fill="#444" font-size="13">anything unmatched is denied once one ACL exists</text>

  <rect x="760" y="400" width="200" height="70" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="860" y="426" text-anchor="middle" font-weight="600" fill="#222">LAN NIC, no NAT</text>
  <text x="860" y="446" text-anchor="middle" fill="#3a9a5b" font-size="13">internet only</text>

  <line x1="190" y1="435" x2="238" y2="435" stroke="#3a9a5b" stroke-width="1.8" marker-end="url(#g)"/>
  <line x1="710" y1="435" x2="758" y2="435" stroke="#3a9a5b" stroke-width="1.8" marker-end="url(#g)"/>
</svg>

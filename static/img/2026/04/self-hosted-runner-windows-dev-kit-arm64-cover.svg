<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">What a job on the Dev Kit actually executes</text>

  <rect x="40" y="60" width="820" height="70" rx="8" fill="#e07a1f"/>
  <text x="450" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">actions.runner service (win-arm64 package, NT AUTHORITY\NETWORK SERVICE by default)</text>
  <text x="450" y="114" text-anchor="middle" font-size="13" fill="#fff">bundles arm64 node.exe for JavaScript actions (node20 / node24 externals)</text>

  <rect x="40" y="160" width="400" height="220" rx="8" fill="#ffffff" stroke="#3a9a5b" stroke-width="2"/>
  <text x="240" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#3a9a5b">Native ARM64</text>
  <g font-size="13" fill="#222">
    <text x="64" y="222">Go toolchain (windows/arm64 release)</text>
    <text x="64" y="248">.NET 6+ SDK</text>
    <text x="64" y="274">Visual Studio 2022 17.4+ / MSVC arm64</text>
    <text x="64" y="300">Windows PowerShell, cmd, built-in tar.exe</text>
    <text x="64" y="326">binaries you build for GOARCH=arm64</text>
  </g>
  <text x="240" y="362" text-anchor="middle" font-size="12" fill="#6b6b6b">full speed on the Snapdragon 8cx Gen 3</text>

  <rect x="460" y="160" width="400" height="220" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="660" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#c0392b">x64 under emulation</text>
  <g font-size="13" fill="#222">
    <text x="484" y="222">any tool that only ships an x64 .exe</text>
    <text x="484" y="248">scripts that hardcode amd64 / x64 downloads</text>
    <text x="484" y="274">GOARCH=amd64 test binaries</text>
    <text x="484" y="300">PHP for Windows (no arm64 builds)</text>
    <text x="484" y="326">reports AMD64 to itself, runs slower</text>
  </g>
  <text x="660" y="362" text-anchor="middle" font-size="12" fill="#6b6b6b">works, but it is not the platform you meant to test</text>
</svg>

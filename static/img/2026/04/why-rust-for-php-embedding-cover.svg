<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#222">One process, one stack: how an HTTP request reaches PHP in ePHPm</text>
  <text x="600" y="74" text-anchor="middle" font-size="16" fill="#6b6b6b">Rust and C share a calling convention, so every hop below is a plain function call</text>

  <!-- process boundary -->
  <rect x="30" y="100" width="1140" height="420" rx="14" fill="none" stroke="#6b6b6b" stroke-dasharray="8 6"/>
  <text x="50" y="126" font-size="15" fill="#6b6b6b">ephpm (single binary, single process)</text>

  <!-- boxes row -->
  <g font-size="16">
    <rect x="60" y="160" width="190" height="110" rx="10" fill="#2b6cb0" opacity="0.12" stroke="#2b6cb0"/>
    <text x="155" y="196" text-anchor="middle" font-weight="600" fill="#2b6cb0">hyper + tokio</text>
    <text x="155" y="222" text-anchor="middle" fill="#333">async accept,</text>
    <text x="155" y="244" text-anchor="middle" fill="#333">parse, route</text>

    <rect x="290" y="160" width="190" height="110" rx="10" fill="#2b6cb0" opacity="0.12" stroke="#2b6cb0"/>
    <text x="385" y="196" text-anchor="middle" font-weight="600" fill="#2b6cb0">blocking thread</text>
    <text x="385" y="222" text-anchor="middle" fill="#333">PhpRequest to</text>
    <text x="385" y="244" text-anchor="middle" fill="#333">CStrings + $_SERVER</text>

    <rect x="520" y="160" width="190" height="110" rx="10" fill="#3a9a5b" opacity="0.14" stroke="#3a9a5b"/>
    <text x="615" y="196" text-anchor="middle" font-weight="600" fill="#3a9a5b">C wrapper</text>
    <text x="615" y="222" text-anchor="middle" fill="#333">SETJMP bailout</text>
    <text x="615" y="244" text-anchor="middle" fill="#333">(zend_try in C)</text>

    <rect x="750" y="160" width="190" height="110" rx="10" fill="#7d5ba6" opacity="0.14" stroke="#7d5ba6"/>
    <text x="845" y="196" text-anchor="middle" font-weight="600" fill="#7d5ba6">libphp.a</text>
    <text x="845" y="222" text-anchor="middle" fill="#333">Zend engine,</text>
    <text x="845" y="244" text-anchor="middle" fill="#333">php_execute_script</text>

    <rect x="980" y="160" width="160" height="110" rx="10" fill="#7d5ba6" opacity="0.14" stroke="#7d5ba6"/>
    <text x="1060" y="196" text-anchor="middle" font-weight="600" fill="#7d5ba6">your app</text>
    <text x="1060" y="222" text-anchor="middle" fill="#333">index.php</text>
    <text x="1060" y="244" text-anchor="middle" fill="#333">echo, header()</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="250" y1="215" x2="286" y2="215"/>
    <line x1="480" y1="215" x2="516" y2="215"/>
    <line x1="710" y1="215" x2="746" y2="215"/>
    <line x1="940" y1="215" x2="976" y2="215"/>
  </g>
  <text x="268" y="150" text-anchor="middle" font-size="13" fill="#333">spawn_blocking</text>
  <text x="498" y="150" text-anchor="middle" font-size="13" fill="#333">extern "C"</text>
  <text x="728" y="150" text-anchor="middle" font-size="13" fill="#333">C call</text>

  <!-- callback lane -->
  <rect x="500" y="340" width="480" height="80" rx="10" fill="#e07a1f" opacity="0.12" stroke="#e07a1f"/>
  <text x="740" y="372" text-anchor="middle" font-size="16" font-weight="600" fill="#b35f12">SAPI callbacks (C, thread-local buffers)</text>
  <text x="740" y="398" text-anchor="middle" font-size="14" fill="#333">ub_write, send_headers, read_post, read_cookies, register_server_variables</text>
  <path d="M845,270 L845,336" stroke="#e07a1f" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text x="855" y="306" font-size="13" fill="#b35f12">PHP calls out</text>

  <!-- return path -->
  <path d="M500,360 L385,360 L385,274" stroke="#e07a1f" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text x="395" y="440" font-size="13" fill="#b35f12">Rust copies body + headers out of the C buffers</text>
  <path d="M290,240 L255,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="155" y="300" text-anchor="middle" font-size="13" fill="#333">hyper writes the</text>
  <text x="155" y="318" text-anchor="middle" font-size="13" fill="#333">Response</text>

  <text x="600" y="490" text-anchor="middle" font-size="15" fill="#6b6b6b">No goroutine scheduler, no GC, no second runtime between the HTTP server and the Zend engine</text>
</svg>

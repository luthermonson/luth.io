<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#222">SIGPROF is process-wide. Your PHP state is not.</text>
  <text x="600" y="74" text-anchor="middle" font-size="16" fill="#6b6b6b">setitimer(ITIMER_PROF) counts CPU time of every thread, and the kernel picks any thread that isn't blocking the signal</text>

  <!-- time axis -->
  <text x="1120" y="520" text-anchor="end" font-size="14" fill="#6b6b6b">time →</text>
  <line x1="230" y1="505" x2="1120" y2="505" stroke="#6b6b6b" stroke-width="1.5"/>

  <!-- lanes -->
  <g font-size="16">
    <text x="40" y="140" fill="#222" font-weight="600">main thread</text>
    <text x="40" y="160" fill="#6b6b6b" font-size="13">php_embed_init()</text>
    <rect x="230" y="122" width="200" height="34" rx="6" fill="#7d5ba6" opacity="0.85"/>
    <text x="330" y="145" text-anchor="middle" fill="#fff" font-size="14">init: install handlers</text>
    <rect x="430" y="122" width="690" height="34" rx="6" fill="#6b6b6b" opacity="0.18"/>
    <text x="775" y="145" text-anchor="middle" fill="#333" font-size="14">blocked in block_on()</text>

    <text x="40" y="220" fill="#222" font-weight="600">tokio worker 1</text>
    <rect x="300" y="202" width="820" height="34" rx="6" fill="#2b6cb0" opacity="0.22"/>
    <text x="40" y="290" fill="#222" font-weight="600">tokio worker 2</text>
    <rect x="300" y="272" width="820" height="34" rx="6" fill="#2b6cb0" opacity="0.22"/>
    <text x="40" y="360" fill="#222" font-weight="600">blocking thread</text>
    <text x="40" y="380" fill="#6b6b6b" font-size="13">running PHP (TSRM slot)</text>
    <rect x="300" y="342" width="820" height="34" rx="6" fill="#3a9a5b" opacity="0.30"/>
    <rect x="510" y="342" width="280" height="34" rx="6" fill="#7d5ba6" opacity="0.85"/>
    <text x="650" y="365" text-anchor="middle" fill="#fff" font-size="14">set_time_limit(): arm ITIMER_PROF</text>
    <text x="40" y="440" fill="#222" font-weight="600">tokio worker N</text>
    <rect x="300" y="422" width="820" height="34" rx="6" fill="#2b6cb0" opacity="0.22"/>
  </g>
  <text x="710" y="225" text-anchor="middle" font-size="14" fill="#2b6cb0">accept / parse / timers (no PHP globals on this thread)</text>

  <!-- signal -->
  <line x1="880" y1="96" x2="880" y2="490" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="890" y="112" font-size="15" font-weight="600" fill="#c0392b">SIGPROF fires</text>
  <path d="M880,170 L880,268" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <circle cx="880" cy="289" r="15" fill="#c0392b"/>
  <text x="880" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">!</text>
  <rect x="905" y="250" width="270" height="78" rx="8" fill="#fff" stroke="#c0392b"/>
  <text x="918" y="274" font-size="14" fill="#c0392b" font-weight="600">PHP's handler runs here</text>
  <text x="918" y="296" font-size="13" fill="#333">NTS: kills the PHP thread's request</text>
  <text x="918" y="316" font-size="13" fill="#333">for CPU it never spent</text>
  <text x="560" y="485" text-anchor="middle" font-size="13" fill="#6b6b6b">the timer counts every thread's CPU; the thread that gets the signal never ran PHP</text>
</svg>

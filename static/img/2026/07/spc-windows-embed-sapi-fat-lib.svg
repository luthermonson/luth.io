<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#222">php8embed.lib on Windows: what nmake gives you vs what a Rust host needs</text>

  <!-- left: default -->
  <text x="215" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#6b6b6b">Default --enable-embed</text>
  <rect x="60" y="92" width="310" height="70" rx="8" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/>
  <text x="215" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#333">php8embed.lib (thin)</text>
  <text x="215" y="142" text-anchor="middle" font-size="13" fill="#333">php_embed.obj, calls via __imp_ thunks</text>
  <line x1="215" y1="162" x2="215" y2="200" stroke="#6b6b6b" stroke-width="2"/>
  <polygon points="209,196 221,196 215,208" fill="#6b6b6b"/>
  <rect x="60" y="210" width="310" height="60" rx="8" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/>
  <text x="215" y="236" text-anchor="middle" font-size="15" fill="#333">php8ts.lib (import lib)</text>
  <text x="215" y="256" text-anchor="middle" font-size="13" fill="#333">resolves to php8ts.dll at runtime</text>
  <rect x="60" y="300" width="310" height="60" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="215" y="326" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="600">host.exe + php8ts.dll + ext DLLs</text>
  <text x="215" y="346" text-anchor="middle" font-size="13" fill="#333">ship the PHP DLLs next to your binary</text>
  <line x1="215" y1="270" x2="215" y2="292" stroke="#6b6b6b" stroke-width="2"/>
  <polygon points="209,288 221,288 215,300" fill="#6b6b6b"/>

  <!-- right: static -->
  <text x="645" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#2b6cb0">Static embed (SPC patch, php-src #22166)</text>
  <rect x="470" y="92" width="350" height="178" rx="8" fill="#eaf1f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="645" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#2b6cb0">php8embed.lib (fat static library)</text>
  <rect x="490" y="132" width="310" height="34" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="645" y="154" text-anchor="middle" font-size="13" fill="#333">php_embed.obj with /D PHP_EXPORTS ... (direct refs)</text>
  <rect x="490" y="174" width="310" height="34" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="645" y="196" text-anchor="middle" font-size="13" fill="#333">PHP_GLOBAL_OBJS: main/, Zend/, TSRM/</text>
  <rect x="490" y="216" width="310" height="34" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="645" y="238" text-anchor="middle" font-size="13" fill="#333">STATIC_EXT_OBJS: openssl, curl, intl, ...</text>
  <rect x="470" y="300" width="350" height="60" rx="8" fill="#eaf6ee" stroke="#3a9a5b" stroke-width="2"/>
  <text x="645" y="326" text-anchor="middle" font-size="15" fill="#3a9a5b" font-weight="600">ephpm.exe</text>
  <text x="645" y="346" text-anchor="middle" font-size="13" fill="#333">one self-contained binary, no PHP DLL</text>
  <line x1="645" y1="270" x2="645" y2="292" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="639,288 651,288 645,300" fill="#2b6cb0"/>

  <text x="430" y="400" text-anchor="middle" font-size="14" fill="#6b6b6b">ZTS gotcha: zend.obj and php_embed.obj both define _tsrm_ls_cache once they share one binary</text>
</svg>

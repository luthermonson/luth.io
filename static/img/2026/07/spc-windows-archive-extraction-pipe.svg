<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#222">7za x -so archive.tar.xz | tar -f - -x -C "C:\..."</text>

  <!-- 7za -->
  <rect x="40" y="90" width="190" height="90" rx="8" fill="#eaf1f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="135" y="125" text-anchor="middle" font-size="18" font-weight="600" fill="#2b6cb0">7za.exe</text>
  <text x="135" y="150" text-anchor="middle" font-size="14" fill="#333">decompress to stdout</text>

  <!-- pipe -->
  <rect x="250" y="122" width="150" height="26" rx="13" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-size="13" fill="#6b6b6b">pipe</text>
  <line x1="230" y1="135" x2="250" y2="135" stroke="#6b6b6b" stroke-width="2"/>
  <line x1="400" y1="135" x2="420" y2="135" stroke="#6b6b6b" stroke-width="2"/>

  <!-- which tar? -->
  <text x="610" y="78" text-anchor="middle" font-size="14" fill="#333">"tar" resolves via PATH to...</text>
  <rect x="420" y="90" width="340" height="90" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#c0392b">Git\usr\bin\tar.exe (GNU tar, MSYS)</text>
  <text x="590" y="145" text-anchor="middle" font-size="13" fill="#333">C:\...: Cannot open: No such file or directory</text>
  <text x="590" y="165" text-anchor="middle" font-size="13" fill="#333">Error is not recoverable: exiting now</text>

  <!-- consequence -->
  <path d="M590 180 C590 230, 135 220, 135 250" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="129,246 141,246 135,258" fill="#c0392b"/>
  <rect x="40" y="262" width="300" height="56" rx="8" fill="#fff4e8" stroke="#e07a1f" stroke-width="2"/>
  <text x="190" y="287" text-anchor="middle" font-size="15" font-weight="600" fill="#e07a1f">7za: ERROR: The pipe has been ended.</text>
  <text x="190" y="307" text-anchor="middle" font-size="13" fill="#333">the writer reports that the reader died</text>

  <!-- correct tar -->
  <rect x="420" y="262" width="340" height="56" rx="8" fill="#eaf6ee" stroke="#3a9a5b" stroke-width="2"/>
  <text x="590" y="287" text-anchor="middle" font-size="15" font-weight="600" fill="#3a9a5b">C:\Windows\System32\tar.exe (bsdtar)</text>
  <text x="590" y="307" text-anchor="middle" font-size="13" fill="#333">same pipe, exit 0</text>

  <text x="400" y="365" text-anchor="middle" font-size="14" fill="#6b6b6b">The pipe was never the problem. The binary on the other end of it was.</text>
</svg>

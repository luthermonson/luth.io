<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#222">Encoding an ssh-ed25519 key for Proxmox's sshkeys parameter</text>
  <g font-size="13">
    <rect x="20" y="50" width="920" height="32" fill="#f2f2f2"/>
    <text x="34" y="71" font-weight="600" fill="#222">encoding</text>
    <text x="300" y="71" font-weight="600" fill="#222">passes ^[-%a-zA-Z0-9_.!~*'()]*$</text>
    <text x="560" y="71" font-weight="600" fill="#222">unescapes back to the key</text>
    <text x="790" y="71" font-weight="600" fill="#222">result</text>
  </g>
  <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#222">
    <text x="34" y="110">raw key</text>
    <text x="34" y="144">url.PathEscape</text>
    <text x="34" y="178">url.QueryEscape</text>
    <text x="34" y="212">base64.StdEncoding</text>
    <text x="34" y="246">base64.URLEncoding</text>
    <text x="34" y="280">base64.RawURLEncoding</text>
    <text x="34" y="314" font-weight="700">EncodeSSHKeys</text>
  </g>
  <g font-size="13" fill="#222">
    <text x="300" y="110">no</text><text x="560" y="110">yes</text>
    <text x="300" y="144">no (+ and @ left as-is)</text><text x="560" y="144">yes</text>
    <text x="300" y="178">no (space becomes +)</text><text x="560" y="178">no</text>
    <text x="300" y="212">no (= padding here)</text><text x="560" y="212">no</text>
    <text x="300" y="246">no (= padding)</text><text x="560" y="246">no</text>
    <text x="300" y="280">yes</text><text x="560" y="280">no (it's base64 text)</text>
    <text x="300" y="314">yes</text><text x="560" y="314">yes</text>
  </g>
  <g>
    <rect x="780" y="94" width="150" height="24" rx="5" fill="#c0392b"/><text x="855" y="111" text-anchor="middle" font-size="12" fill="#fff">400 invalid format</text>
    <rect x="780" y="128" width="150" height="24" rx="5" fill="#c0392b"/><text x="855" y="145" text-anchor="middle" font-size="12" fill="#fff">400 invalid format</text>
    <rect x="780" y="162" width="150" height="24" rx="5" fill="#c0392b"/><text x="855" y="179" text-anchor="middle" font-size="12" fill="#fff">400 invalid format</text>
    <rect x="780" y="196" width="150" height="24" rx="5" fill="#c0392b"/><text x="855" y="213" text-anchor="middle" font-size="12" fill="#fff">400 invalid format</text>
    <rect x="780" y="230" width="150" height="24" rx="5" fill="#c0392b"/><text x="855" y="247" text-anchor="middle" font-size="12" fill="#fff">400 invalid format</text>
    <rect x="780" y="264" width="150" height="24" rx="5" fill="#e07a1f"/><text x="855" y="281" text-anchor="middle" font-size="12" fill="#fff">not a valid key</text>
    <rect x="780" y="298" width="150" height="24" rx="5" fill="#3a9a5b"/><text x="855" y="315" text-anchor="middle" font-size="12" fill="#fff">accepted</text>
  </g>
  <text x="480" y="356" text-anchor="middle" font-size="12" fill="#6b6b6b">validator columns from running each encoder against PVE's pve_verify_urlencoded regex; result column is what that implies</text>
</svg>
